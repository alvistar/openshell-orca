name: guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: prek run --all-files --show-diff-on-failure
      - run: prek run --all-files --hook-stage manual
